# Sabt CRM — analyzer configuration.
#
# Base: the Flutter team's recommended lint set. On top of it this
# project enables strict type inference and a small curated rule set
# that guards the mistakes this codebase can actually make (leaked
# subscriptions, stray prints, ambiguous returns). Rules are added
# only when the whole tree passes them — a lint that is permanently
# ignored is worse than no lint at all.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_single_quotes
    - type_annotate_public_apis
